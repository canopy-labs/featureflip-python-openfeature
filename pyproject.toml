[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "featureflip-openfeature-provider"
version = "0.2.1"
description = "OpenFeature provider for Featureflip (Python server SDK)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Featureflip Team" }
]
keywords = ["openfeature", "feature-flags", "feature-toggles", "featureflip", "provider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Lower-bounded, never pinned: the application owns these versions, and one
# `featureflip` copy has to back both this provider and any direct SDK use, so
# the process shares a single client core per SDK key.
#
# The floor is 2.10.0 — the first release whose `variation_detail()` records an
# evaluation event (#4300). The provider resolves every flag through it, so on an
# older SDK its reads never reach analytics, staleness or the archive guard. 2.10.0
# also carries what earlier floors required: `on_update` (2.7.0) and the wrapper
# identity (2.8.0).
dependencies = [
    "featureflip>=2.10.0",
    "openfeature-sdk>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://featureflip.io"
Documentation = "https://featureflip.io/docs/integrations/openfeature/"
Repository = "https://github.com/canopy-labs/featureflip-python-openfeature"

[tool.hatch.build.targets.wheel]
packages = ["src/featureflip_openfeature"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["featureflip_openfeature"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
files = ["src/featureflip_openfeature"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
